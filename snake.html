<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snakes & Ladders: Plastic Edition</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

    <style>
        :root {
            --plastic-blue: #3b82f6;
            --plastic-red: #ef4444;
            --plastic-green: #22c55e;
            --plastic-yellow: #eab308;
            --glass: rgba(255, 255, 255, 0.1);
            --gloss: linear-gradient(180deg, rgba(255,255,255,0.4) 0%, rgba(255,255,255,0) 50%);
        }

        body {
            font-family: 'Arial Rounded MT Bold', 'Helvetica', sans-serif;
            background: radial-gradient(circle, #1e293b 0%, #0f172a 100%);
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
            padding: 20px;
            overflow-x: hidden;
        }

        /* Plastic Button Style */
        button {
            position: relative;
            background: var(--plastic-blue);
            border: none;
            padding: 15px 25px;
            border-radius: 15px;
            color: white;
            font-weight: 800;
            text-transform: uppercase;
            cursor: pointer;
            box-shadow: 0 5px 0 #1d4ed8, 0 8px 15px rgba(0,0,0,0.4);
            transition: all 0.1s;
            overflow: hidden;
        }
        button::before {
            content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 50%;
            background: var(--gloss); pointer-events: none;
        }
        button:active { transform: translateY(4px); box-shadow: 0 1px 0 #1d4ed8; }

        /* Screens */
        .screen { display: none; background: #334155; padding: 40px; border-radius: 25px; border: 4px solid #475569; box-shadow: inset 0 0 20px rgba(0,0,0,0.5); }
        .active-screen { display: block; }

        /* Board Container */
        #game-layout { display: none; gap: 20px; align-items: flex-start; margin-top: 20px; }
        
        #board-wrapper {
            position: relative;
            background: #cbd5e1;
            padding: 15px;
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5), inset 0 0 10px rgba(0,0,0,0.2);
        }

        #board {
            display: grid;
            grid-template-columns: repeat(10, 50px);
            grid-template-rows: repeat(10, 50px);
            border: 2px solid #94a3b8;
        }

        .cell {
            width: 50px; height: 50px; border: 0.5px solid rgba(0,0,0,0.05);
            display: flex; align-items: center; justify-content: center;
            font-size: 0.7rem; color: #64748b; font-weight: bold; position: relative;
        }
        .cell:nth-child(odd) { background: #f8fafc; }
        .cell:nth-child(even) { background: #e2e8f0; }

        /* Tokens */
        .token {
            width: 25px; height: 25px; border-radius: 50%; position: absolute;
            transition: all 0.6s cubic-bezier(0.68, -0.55, 0.27, 1.55);
            z-index: 20; border: 3px solid rgba(255,255,255,0.8);
            box-shadow: 0 4px 8px rgba(0,0,0,0.5);
        }

        /* 3D Dice */
        .scene { width: 60px; height: 60px; perspective: 300px; margin: 20px auto; }
        .dice {
            width: 100%; height: 100%; position: relative; transform-style: preserve-3d;
            transition: transform 1s cubic-bezier(0.17, 0.67, 0.83, 0.67);
        }
        .dice-face {
            position: absolute; width: 60px; height: 60px; background: white;
            border: 2px solid #ddd; border-radius: 10px; display: flex; align-items: center;
            justify-content: center; font-size: 2rem; color: #333; box-shadow: inset 0 0 10px #ccc;
        }
        .f1 { transform: rotateY(0deg) translateZ(30px); }
        .f2 { transform: rotateY(90deg) translateZ(30px); }
        .f3 { transform: rotateY(180deg) translateZ(30px); }
        .f4 { transform: rotateY(-90deg) translateZ(30px); }
        .f5 { transform: rotateX(90deg) translateZ(30px); }
        .f6 { transform: rotateX(-90deg) translateZ(30px); }

        /* Side Panel: Leaderboard & Scores */
        .panel {
            width: 260px; background: #1e293b; padding: 20px; border-radius: 20px;
            border: 4px solid #334155; box-shadow: 10px 10px 0 rgba(0,0,0,0.2);
        }
        .score-row {
            display: flex; justify-content: space-between; padding: 10px;
            margin-bottom: 5px; border-radius: 10px; background: rgba(0,0,0,0.2);
        }
        .active-turn { border: 2px solid var(--plastic-green); box-shadow: 0 0 15px var(--plastic-green); }

        /* Snake Images Layer */
        #snake-images-layer { position: absolute; top:0; left:0; width:100%; height:100%; pointer-events: none; z-index: 5; }
        .snake-img { position: absolute; width: 80px; height: 80px; border-radius: 50%; object-fit: cover; border: 3px solid var(--plastic-red); opacity: 0.8; }
    </style>
</head>
<body>

    <h1 style="text-shadow: 0 4px 0 #000;">PLASTIC REPTILES <span style="color: var(--plastic-red);">3D</span></h1>

    <div id="entry-screen" class="screen active-screen">
        <input type="text" id="player-name" placeholder="ENTER NAME" style="width: 100%; padding: 15px; border-radius: 10px; border:none; margin-bottom: 15px; font-size: 1.2rem; text-align: center;">
        <button onclick="createRoom()">Create Room</button>
        <div style="margin: 20px 0; font-weight: bold; opacity: 0.5;">- OR -</div>
        <input type="text" id="join-code" placeholder="6-CHAR CODE" style="width: 100%; padding: 15px; border-radius: 10px; border:none; margin-bottom: 15px; text-align: center;">
        <button onclick="joinRoom()" style="background: var(--plastic-green); box-shadow: 0 5px 0 #15803d;">Join Room</button>
    </div>

    <div id="lobby-screen" class="screen">
        <h2>ROOM: <span id="display-code" style="color: var(--plastic-yellow);">------</span></h2>
        <div id="player-list-lobby" style="margin: 20px 0; min-height: 100px;"></div>
        <div id="pending-list"></div>
        <button id="start-btn" onclick="startGameTrigger()" style="display:none; background: var(--plastic-red); box-shadow: 0 5px 0 #991b1b;">Launch Game</button>
    </div>

    <div id="game-layout">
        <div id="board-wrapper">
            <div id="board"></div>
            <div id="tokens-layer"></div>
            <div id="snake-images-layer"></div>
            <svg id="vfx-layer" viewBox="0 0 500 500" style="position:absolute; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:4;"></svg>
        </div>

        <div class="panel">
            <h3 style="margin-top:0;">Scoreboard</h3>
            <div id="score-list"></div>
            <hr style="border: 1px solid #334155;">
            
            <div class="scene">
                <div class="dice" id="dice">
                    <div class="dice-face f1">1</div>
                    <div class="dice-face f2">2</div>
                    <div class="dice-face f3">3</div>
                    <div class="dice-face f4">4</div>
                    <div class="dice-face f5">5</div>
                    <div class="dice-face f6">6</div>
                </div>
            </div>

            <button id="roll-btn" onclick="handleRoll()">Shake & Roll</button>
            <p id="turn-text" style="font-size: 0.8rem; margin-top: 15px; color: #94a3b8;"></p>
        </div>
    </div>

    <script>
        // --- FIREBASE SETUP ---
        const firebaseConfig = { 
            apiKey: "AIzaSyDaeNQF4qmW0vvwxUPp_NztnT0hoLzm1BQ", 
            authDomain: "svls-289ee.firebaseapp.com", 
            projectId: "svls-289ee",
            databaseURL: "https://svls-289ee-default-rtdb.firebaseio.com",
            storageBucket: "svls-289ee.firebasestorage.app", 
            messagingSenderId: "500705386198", 
            appId: "1:500705386198:web:96f189662bc2aa99cf7377"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let roomCode = null;
        let myId = "p" + Math.floor(Math.random() * 1000000);
        let myName = "";
        let isHost = false;
        let localState = null;

        const snakes = { 17: 4, 54: 34, 62: 19, 98: 79, 87: 36, 95: 75 };
        const ladders = { 3: 22, 8: 30, 28: 84, 58: 77, 71: 91 };
        const snakeImgs = [
            "https://images.unsplash.com/photo-1531386151447-fd76ad500b2a?auto=format&fit=crop&w=100&q=80",
            "https://images.unsplash.com/photo-1629190844820-0084f728f3e5?auto=format&fit=crop&w=100&q=80"
        ];

        // --- ROOM LOGIC ---
        function createRoom() {
            myName = document.getElementById('player-name').value.toUpperCase() || "PLAYER 1";
            roomCode = Math.random().toString(36).substring(2, 8).toUpperCase();
            isHost = true;
            const init = {
                status: 'lobby', host: myId, turnIndex: 0, lastRoll: 1,
                players: { [myId]: { name: myName, pos: 1, color: '#3b82f6', score: 0 } },
                order: [myId]
            };
            db.ref('rooms/' + roomCode).set(init).then(() => { enterLobby(); listen(); });
        }

        function joinRoom() {
            roomCode = document.getElementById('join-code').value.toUpperCase();
            myName = document.getElementById('player-name').value.toUpperCase() || "PLAYER";
            if(!roomCode) return;
            db.ref('rooms/' + roomCode + '/pending/' + myId).set({ name: myName });
            document.getElementById('entry-screen').innerHTML = "<h2>Awaiting Admission...</h2>";
            listen();
        }

        function listen() {
            db.ref('rooms/' + roomCode).on('value', snap => {
                const data = snap.val(); if(!data) return;
                localState = data;
                if(data.players && data.players[myId]) {
                    enterLobby();
                    updateLobbyUI(data);
                }
                if(data.status === 'playing') showGame(data);
            });
        }

        function enterLobby() {
            document.getElementById('entry-screen').className = 'screen';
            document.getElementById('lobby-screen').className = 'screen active-screen';
            document.getElementById('display-code').innerText = roomCode;
        }

        function updateLobbyUI(data) {
            const list = document.getElementById('player-list-lobby');
            list.innerHTML = "<h4>PLAYERS:</h4>" + Object.values(data.players).map(p => `<div>• ${p.name}</div>`).join('');
            
            const pending = document.getElementById('pending-list');
            pending.innerHTML = "";
            if(data.pending) {
                Object.keys(data.pending).forEach(pid => {
                    pending.innerHTML += `<div style="display:flex; justify-content:space-between; margin-top:10px;">
                        <span>${data.pending[pid].name}</span>
                        <button onclick="admit('${pid}', '${data.pending[pid].name}')" style="padding:5px; font-size:0.7rem;">Admit</button>
                    </div>`;
                });
            }
            if(isHost) document.getElementById('start-btn').style.display = 'block';
        }

        function admit(pid, name) {
            const colors = ['#ef4444', '#22c55e', '#eab308', '#a855f7'];
            const count = Object.keys(localState.players).length;
            const up = {};
            up[`players/${pid}`] = { name: name, pos: 1, color: colors[count-1] || '#fff', score: 0 };
            up[`pending/${pid}`] = null;
            const newOrder = localState.order || []; newOrder.push(pid);
            up[`order`] = newOrder;
            db.ref('rooms/' + roomCode).update(up);
        }

        function startGameTrigger() { db.ref('rooms/' + roomCode).update({ status: 'playing' }); }

        // --- GAMEPLAY ---
        function showGame(data) {
            document.getElementById('lobby-screen').className = 'screen';
            document.getElementById('game-layout').style.display = 'flex';
            if(!document.getElementById('cell-1')) {
                buildBoard();
                placeDecoration();
            }
            updateVisuals(data);
        }

        function buildBoard() {
            const board = document.getElementById('board');
            for(let r=9; r>=0; r--) {
                for(let c=0; c<10; c++) {
                    let n = (r % 2 !== 0) ? (r*10)+(10-c) : (r*10)+(c+1);
                    const cell = document.createElement('div');
                    cell.className = 'cell'; cell.id = `cell-${n}`; cell.innerText = n;
                    board.appendChild(cell);
                }
            }
        }

        function placeDecoration() {
            const layer = document.getElementById('snake-images-layer');
            Object.keys(snakes).forEach((s, i) => {
                const cell = document.getElementById(`cell-${s}`);
                const img = document.createElement('img');
                img.src = snakeImgs[i % 2]; img.className = 'snake-img';
                img.style.left = cell.offsetLeft + 'px'; img.style.top = cell.offsetTop + 'px';
                layer.appendChild(img);
            });
        }

        function updateVisuals(data) {
            // Scores & Turn
            const activeId = data.order[data.turnIndex];
            const isMyTurn = (activeId === myId);
            document.getElementById('roll-btn').disabled = !isMyTurn;
            document.getElementById('turn-text').innerText = isMyTurn ? "IT IS YOUR TURN!" : `WAITING FOR ${data.players[activeId].name}...`;

            const scoreDiv = document.getElementById('score-list');
            scoreDiv.innerHTML = data.order.map(id => {
                const p = data.players[id];
                return `<div class="score-row ${id === activeId ? 'active-turn' : ''}">
                    <span style="color:${p.color}">● ${p.name}</span>
                    <span>Tile: ${p.pos}</span>
                </div>`;
            }).join('');

            // Tokens
            const tLayer = document.getElementById('tokens-layer');
            data.order.forEach((id, i) => {
                let t = document.getElementById(`t-${id}`);
                if(!t) {
                    t = document.createElement('div'); t.className = 'token'; t.id = `t-${id}`;
                    t.style.backgroundColor = data.players[id].color;
                    tLayer.appendChild(t);
                }
                const cell = document.getElementById(`cell-${data.players[id].pos}`);
                t.style.left = (cell.offsetLeft + 10 + (i*4)) + 'px';
                t.style.top = (cell.offsetTop + 10 + (i*4)) + 'px';
            });

            // Sync Dice Rotation
            rotateDice(data.lastRoll);
        }

        function rotateDice(val) {
            const d = document.getElementById('dice');
            const rots = { 1:'rotateX(0deg) rotateY(0deg)', 2:'rotateY(-90deg)', 3:'rotateY(-180deg)', 4:'rotateY(90deg)', 5:'rotateX(-90deg)', 6:'rotateX(90deg)' };
            d.style.transform = rots[val];
        }

        async function handleRoll() {
            const roll = Math.floor(Math.random() * 6) + 1;
            document.getElementById('roll-btn').disabled = true;
            
            // Random spin animation
            const d = document.getElementById('dice');
            d.style.transition = '0.5s';
            d.style.transform = `rotateX(${Math.random()*360}deg) rotateY(${Math.random()*360}deg)`;

            setTimeout(async () => {
                d.style.transition = '1s';
                let nPos = localState.players[myId].pos + roll;
                if(nPos > 100) nPos = 100;
                if(snakes[nPos]) nPos = snakes[nPos];
                if(ladders[nPos]) nPos = ladders[nPos];

                const nextTurn = (localState.turnIndex + 1) % localState.order.length;
                const up = {};
                up[`players/${myId}/pos`] = nPos;
                up[`turnIndex`] = nextTurn;
                up[`lastRoll`] = roll;
                
                if(nPos === 100) alert("WINNER!");
                await db.ref('rooms/' + roomCode).update(up);
            }, 600);
        }
    </script>
</body>
</html>
