<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snakes & Ladders</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
<style>
  :root {
    --cell: 52px;
    --cols: 10;
    --board-size: calc(var(--cell) * var(--cols));
    --green-light: #8bc34a;
    --green-dark: #558b2f;
    --cream: #fdf6e3;
    --wood: #795548;
    --wood-dark: #4e342e;
    --red: #e53935;
    --blue: #1e88e5;
    --yellow: #fdd835;
    --purple: #8e24aa;
    --orange: #fb8c00;
    --sky: #e1f5fe;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Nunito', sans-serif;
    background: #2d5a27;
    background-image:
      radial-gradient(ellipse at 20% 20%, #3a7a32 0%, transparent 50%),
      radial-gradient(ellipse at 80% 80%, #1a3a16 0%, transparent 50%),
      url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23ffffff' fill-opacity='0.03'%3E%3Ccircle cx='30' cy='30' r='2'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 16px;
  }

  h1 {
    font-family: 'Fredoka One', cursive;
    font-size: 2.4rem;
    color: #fff;
    text-shadow: 0 3px 0 #1a3a16, 0 6px 12px rgba(0,0,0,0.4);
    letter-spacing: 2px;
    margin-bottom: 16px;
    display: flex; align-items: center; gap: 12px;
  }
  h1 .emoji { font-size: 2rem; }

  /* ── SCREENS ── */
  .screen { display: none; }
  .screen.active { display: flex; flex-direction: column; align-items: center; gap: 14px; }

  .card {
    background: var(--cream);
    border-radius: 20px;
    padding: 32px 36px;
    width: 340px;
    box-shadow: 0 8px 0 var(--wood-dark), 0 16px 40px rgba(0,0,0,0.4);
    border: 3px solid var(--wood);
  }
  .card h2 {
    font-family: 'Fredoka One', cursive;
    font-size: 1.5rem;
    color: var(--wood-dark);
    text-align: center;
    margin-bottom: 20px;
  }

  .field {
    width: 100%;
    padding: 12px 16px;
    border-radius: 12px;
    border: 3px solid #c8b89a;
    background: white;
    font-family: 'Nunito', sans-serif;
    font-size: 1rem;
    font-weight: 700;
    color: #333;
    outline: none;
    transition: border-color 0.2s;
  }
  .field:focus { border-color: var(--green-dark); }
  .field::placeholder { color: #bbb; font-weight: 600; }

  .divider { text-align: center; color: #aaa; font-weight: 800; font-size: 0.85rem; }

  .btn {
    width: 100%;
    padding: 14px 20px;
    border-radius: 14px;
    border: none;
    font-family: 'Fredoka One', cursive;
    font-size: 1.1rem;
    letter-spacing: 1px;
    cursor: pointer;
    position: relative;
    transition: transform 0.1s, box-shadow 0.1s;
    overflow: hidden;
  }
  .btn::after {
    content: '';
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 45%;
    background: rgba(255,255,255,0.25);
    border-radius: 14px 14px 50% 50%;
    pointer-events: none;
  }
  .btn:active { transform: translateY(3px); box-shadow: none !important; }
  .btn-create { background: var(--blue); color: white; box-shadow: 0 5px 0 #1256a0; }
  .btn-join   { background: var(--green-light); color: white; box-shadow: 0 5px 0 var(--green-dark); }
  .btn-start  { background: var(--red); color: white; box-shadow: 0 5px 0 #911; }
  .btn-roll   { background: var(--yellow); color: #333; box-shadow: 0 5px 0 #b8960c; font-size: 1.3rem; width: 100%; }
  .btn-roll:disabled { opacity: 0.45; cursor: not-allowed; transform: none !important; box-shadow: 0 5px 0 #b8960c !important; }

  /* ── LOBBY ── */
  .room-code {
    font-family: 'Fredoka One', cursive;
    font-size: 2.2rem;
    letter-spacing: 8px;
    color: var(--yellow);
    text-shadow: 0 2px 0 #7a5500;
    text-align: center;
    background: var(--wood-dark);
    padding: 10px 20px;
    border-radius: 12px;
  }
  .player-chip {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 14px;
    background: white;
    border-radius: 12px;
    border: 2px solid #ddd;
    font-weight: 700;
    font-size: 0.95rem;
  }
  .color-dot { width: 18px; height: 18px; border-radius: 50%; flex-shrink: 0; border: 2px solid rgba(0,0,0,0.15); }
  .pending-chip {
    display: flex; align-items: center; justify-content: space-between;
    padding: 8px 12px; background: #fff8e1; border-radius: 10px;
    border: 2px dashed #f9a825; font-weight: 700;
  }
  .admit-btn {
    background: var(--green-light); color: white; border: none; padding: 5px 12px;
    border-radius: 8px; font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 0.8rem;
    cursor: pointer; box-shadow: 0 2px 0 var(--green-dark);
  }
  .admit-btn:active { transform: translateY(2px); box-shadow: none; }

  /* ── GAME LAYOUT ── */
  #game-layout {
    display: none;
    gap: 20px;
    align-items: flex-start;
    flex-wrap: wrap;
    justify-content: center;
  }

  /* ── BOARD ── */
  #board-wrapper {
    position: relative;
    background: var(--wood);
    padding: 14px;
    border-radius: 18px;
    box-shadow: 0 10px 0 var(--wood-dark), 0 20px 50px rgba(0,0,0,0.5);
    border: 4px solid var(--wood-dark);
  }

  #board {
    display: grid;
    grid-template-columns: repeat(10, var(--cell));
    grid-template-rows: repeat(10, var(--cell));
    border: 2px solid rgba(0,0,0,0.2);
    border-radius: 4px;
    overflow: hidden;
    position: relative;
  }

  .cell {
    width: var(--cell); height: var(--cell);
    display: flex; align-items: flex-start; justify-content: flex-end;
    padding: 3px 5px;
    font-size: 0.65rem; font-weight: 800;
    color: rgba(0,0,0,0.35);
    position: relative;
    user-select: none;
  }
  .cell-light { background: #c8e6c9; }
  .cell-dark  { background: #a5d6a7; }
  .cell.snake-head { background: #ffcdd2 !important; }
  .cell.ladder-base { background: #fff9c4 !important; }

  /* tokens layer sits on top */
  #overlay-svg {
    position: absolute; top: 0; left: 0;
    width: var(--board-size); height: var(--board-size);
    pointer-events: none; z-index: 10;
    overflow: visible;
  }

  .token-circle {
    transition: cx 0.55s cubic-bezier(0.34,1.56,0.64,1), cy 0.55s cubic-bezier(0.34,1.56,0.64,1);
  }

  /* ── SIDE PANEL ── */
  .panel {
    width: 220px;
    background: var(--cream);
    border-radius: 18px;
    padding: 18px;
    border: 3px solid var(--wood);
    box-shadow: 0 8px 0 var(--wood-dark), 0 16px 30px rgba(0,0,0,0.3);
    display: flex; flex-direction: column; gap: 12px;
  }
  .panel-title {
    font-family: 'Fredoka One', cursive;
    font-size: 1.2rem; color: var(--wood-dark);
    text-align: center; border-bottom: 2px solid #e0d4c0; padding-bottom: 8px;
  }

  .score-row {
    display: flex; align-items: center; gap: 8px;
    padding: 9px 12px; border-radius: 12px;
    background: white; border: 2px solid #e5dac8;
    font-weight: 700; font-size: 0.9rem;
    transition: box-shadow 0.2s, border-color 0.2s;
  }
  .score-row.my-turn {
    border-color: var(--green-dark);
    box-shadow: 0 0 0 3px #c8e6c9, inset 0 0 8px rgba(88,167,22,0.12);
  }
  .score-row .tile-num {
    margin-left: auto;
    font-size: 0.78rem; color: #888; font-weight: 700;
  }

  /* ── 3D DICE ── */
  .dice-scene {
    perspective: 260px;
    width: 60px; height: 60px;
    margin: 0 auto;
  }
  .dice3d {
    width: 60px; height: 60px;
    position: relative; transform-style: preserve-3d;
    transition: transform 0.9s cubic-bezier(0.17,0.67,0.83,0.67);
  }
  .d-face {
    position: absolute; width: 60px; height: 60px;
    background: white; border-radius: 10px;
    border: 2px solid #ddd;
    box-shadow: inset 0 0 8px #ccc;
    display: grid; grid-template-columns: 1fr 1fr 1fr;
    grid-template-rows: 1fr 1fr 1fr;
    padding: 8px; gap: 4px;
  }
  .pip { background: #222; border-radius: 50%; }
  .pip.empty { background: transparent; }
  .df1 { transform: rotateY(0deg)   translateZ(30px); }
  .df2 { transform: rotateY(90deg)  translateZ(30px); }
  .df3 { transform: rotateY(180deg) translateZ(30px); }
  .df4 { transform: rotateY(-90deg) translateZ(30px); }
  .df5 { transform: rotateX(90deg)  translateZ(30px); }
  .df6 { transform: rotateX(-90deg) translateZ(30px); }

  .turn-text {
    font-size: 0.82rem; text-align: center; font-weight: 700;
    min-height: 38px;
    color: #666;
    line-height: 1.4;
  }
  .turn-text.my-turn { color: var(--green-dark); font-size: 0.9rem; }

  /* ── WIN OVERLAY ── */
  #win-overlay {
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,0.75);
    z-index: 100; align-items: center; justify-content: center;
  }
  #win-overlay.show { display: flex; }
  .win-card {
    background: var(--cream);
    border-radius: 24px; padding: 44px 48px;
    text-align: center;
    border: 4px solid var(--wood);
    box-shadow: 0 12px 0 var(--wood-dark);
    animation: popIn 0.5s cubic-bezier(0.34,1.56,0.64,1);
  }
  @keyframes popIn { from { transform: scale(0.3); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .win-title { font-family: 'Fredoka One', cursive; font-size: 2.8rem; color: var(--green-dark); }
  .win-sub { font-size: 1.1rem; color: #555; margin: 10px 0 24px; font-weight: 700; }

  /* ── TOAST ── */
  #toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(80px);
    background: #333; color: white; padding: 12px 24px; border-radius: 50px;
    font-weight: 700; font-size: 0.95rem;
    transition: transform 0.35s cubic-bezier(0.34,1.56,0.64,1);
    z-index: 200; pointer-events: none;
    white-space: nowrap;
  }
  #toast.show { transform: translateX(-50%) translateY(0); }
  #toast.snake { background: var(--red); }
  #toast.ladder { background: var(--green-dark); }

  @media (max-width: 640px) {
    :root { --cell: 34px; }
    h1 { font-size: 1.6rem; }
    .panel { width: 100%; flex-direction: row; flex-wrap: wrap; }
    #board-wrapper { padding: 8px; border-radius: 12px; }
  }
</style>
</head>
<body>

<h1><span class="emoji">🐍</span> Snakes &amp; Ladders <span class="emoji">🪜</span></h1>

<!-- ENTRY SCREEN -->
<div id="entry-screen" class="screen active">
  <div class="card">
    <h2>🎮 Join the Game</h2>
    <input class="field" id="player-name" placeholder="Your Name" maxlength="18" style="margin-bottom:10px;">
    <button class="btn btn-create" onclick="createRoom()">Create New Room</button>
    <div class="divider" style="margin:14px 0;">— or —</div>
    <input class="field" id="join-code" placeholder="Room Code (6 chars)" maxlength="6" style="margin-bottom:10px; text-transform:uppercase; letter-spacing:4px; text-align:center;">
    <button class="btn btn-join" onclick="joinRoom()">Join Room</button>
  </div>
</div>

<!-- LOBBY SCREEN -->
<div id="lobby-screen" class="screen">
  <div class="card">
    <h2>🏠 Lobby</h2>
    <div class="room-code" id="display-code">------</div>
    <p style="text-align:center; font-size:0.8rem; color:#888; margin-top:6px;">Share this code with friends</p>
    <div id="player-list-lobby" style="display:flex; flex-direction:column; gap:8px; margin-top:16px;"></div>
    <div id="pending-list" style="display:flex; flex-direction:column; gap:8px; margin-top:8px;"></div>
    <button class="btn btn-start" id="start-btn" onclick="startGameTrigger()" style="display:none; margin-top:18px;">🚀 Start Game</button>
    <p id="waiting-msg" style="text-align:center; color:#aaa; font-size:0.85rem; margin-top:8px;"></p>
  </div>
</div>

<!-- GAME -->
<div id="game-layout">
  <div id="board-wrapper">
    <div id="board"></div>
    <!-- SVG overlay: snakes, ladders, tokens -->
    <svg id="overlay-svg" xmlns="http://www.w3.org/2000/svg"></svg>
  </div>

  <div class="panel">
    <div class="panel-title">Scoreboard</div>
    <div id="score-list"></div>

    <div style="border-top: 2px solid #e0d4c0; padding-top: 12px;">
      <div class="dice-scene">
        <div class="dice3d" id="dice">
          <!-- Faces with proper pip layouts -->
          <div class="d-face df1" id="df1"></div>
          <div class="d-face df2" id="df2"></div>
          <div class="d-face df3" id="df3"></div>
          <div class="d-face df4" id="df4"></div>
          <div class="d-face df5" id="df5"></div>
          <div class="d-face df6" id="df6"></div>
        </div>
      </div>
      <div style="text-align:center; margin: 8px 0 4px; font-family: 'Fredoka One'; font-size:1.4rem; color: var(--wood-dark);" id="dice-num">–</div>
      <button class="btn btn-roll" id="roll-btn" onclick="handleRoll()" disabled>🎲 Roll!</button>
      <div class="turn-text" id="turn-text"></div>
    </div>
  </div>
</div>

<div id="win-overlay">
  <div class="win-card">
    <div style="font-size:4rem;">🏆</div>
    <div class="win-title" id="win-name">You Won!</div>
    <div class="win-sub" id="win-sub"></div>
    <button class="btn btn-start" onclick="location.reload()" style="width:auto; padding:14px 36px;">Play Again</button>
  </div>
</div>

<div id="toast">🐍 Oops! Snake!</div>

<script>
// ── FIREBASE ──
const firebaseConfig = {
  apiKey: "AIzaSyDaeNQF4qmW0vvwxUPp_NztnT0hoLzm1BQ",
  authDomain: "svls-289ee.firebaseapp.com",
  projectId: "svls-289ee",
  databaseURL: "https://svls-289ee-default-rtdb.firebaseio.com",
  storageBucket: "svls-289ee.firebasestorage.app",
  messagingSenderId: "500705386198",
  appId: "1:500705386198:web:96f189662bc2aa99cf7377"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

const PLAYER_COLORS = ['#e53935','#1e88e5','#43a047','#f9a825','#8e24aa','#00897b'];

const snakes  = { 98:10, 95:75, 87:36, 62:19, 54:34, 44:22, 23:3, 17:4 };
const ladders = { 3:22, 8:30, 25:55, 28:76, 36:57, 58:77, 71:91 };

// ── STATE ──
let roomCode = null;
let myId = "p" + Math.random().toString(36).slice(2,8);
let myName = "";
let isHost = false;
let localState = null;
let boardBuilt = false;
let rolling = false;

// ── DICE PIPS ──
const PIP_LAYOUTS = {
  1: ['','','', '','X','', '','',''],
  2: ['X','','', '','','', '','','X'],
  3: ['X','','', '','X','', '','','X'],
  4: ['X','','X', '','','', 'X','','X'],
  5: ['X','','X', '','X','', 'X','','X'],
  6: ['X','','X', 'X','','X', 'X','','X'],
};
function buildDiceFace(el, val) {
  el.innerHTML = '';
  PIP_LAYOUTS[val].forEach(p => {
    const d = document.createElement('div');
    d.className = p === 'X' ? 'pip' : 'pip empty';
    el.appendChild(d);
  });
}
[1,2,3,4,5,6].forEach(v => buildDiceFace(document.getElementById(`df${v}`), v));

// ── ENTRY SCREENS ──
function setScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  const el = document.getElementById(id);
  if (el) el.classList.add('active');
}

function createRoom() {
  myName = (document.getElementById('player-name').value.trim() || 'Player 1').toUpperCase();
  roomCode = Math.random().toString(36).substring(2,8).toUpperCase();
  isHost = true;
  const init = {
    status: 'lobby', host: myId, turnIndex: 0, lastRoll: 1,
    players: { [myId]: { name: myName, pos: 1, rawPos: 1, color: PLAYER_COLORS[0], score: 0 } },
    order: [myId]
  };
  db.ref('rooms/' + roomCode).set(init).then(() => { enterLobby(); listen(); });
}

function joinRoom() {
  roomCode = (document.getElementById('join-code').value.trim() || '').toUpperCase();
  myName = (document.getElementById('player-name').value.trim() || 'Player').toUpperCase();
  if (!roomCode) return;
  db.ref('rooms/' + roomCode + '/pending/' + myId).set({ name: myName });
  setScreen('lobby-screen');
  document.getElementById('display-code').innerText = roomCode;
  document.getElementById('waiting-msg').innerText = '⏳ Waiting for host to admit you…';
  listen();
}

function listen() {
  db.ref('rooms/' + roomCode).on('value', snap => {
    const data = snap.val(); if (!data) return;
    localState = data;
    if (data.players && data.players[myId]) {
      enterLobby();
      updateLobbyUI(data);
    }
    if (data.status === 'playing') showGame(data);
  });
}

function enterLobby() {
  setScreen('lobby-screen');
  document.getElementById('display-code').innerText = roomCode;
  document.getElementById('waiting-msg').innerText = '';
}

function updateLobbyUI(data) {
  const list = document.getElementById('player-list-lobby');
  list.innerHTML = '';
  (data.order || []).forEach(id => {
    const p = data.players[id];
    const chip = document.createElement('div');
    chip.className = 'player-chip';
    chip.innerHTML = `<div class="color-dot" style="background:${p.color}"></div>${p.name}${id === data.host ? ' 👑' : ''}`;
    list.appendChild(chip);
  });

  const pend = document.getElementById('pending-list');
  pend.innerHTML = '';
  if (data.pending) {
    Object.keys(data.pending).forEach(pid => {
      const pc = document.createElement('div');
      pc.className = 'pending-chip';
      pc.innerHTML = `<span>🔔 ${data.pending[pid].name}</span>`;
      if (isHost) {
        const ab = document.createElement('button');
        ab.className = 'admit-btn'; ab.innerText = 'Admit';
        ab.onclick = () => admit(pid, data.pending[pid].name);
        pc.appendChild(ab);
      }
      pend.appendChild(pc);
    });
  }
  if (isHost) document.getElementById('start-btn').style.display = 'block';
}

function admit(pid, name) {
  const count = Object.keys(localState.players).length;
  const up = {};
  up[`players/${pid}`] = { name: name, pos: 1, rawPos: 1, color: PLAYER_COLORS[count % PLAYER_COLORS.length], score: 0 };
  up[`pending/${pid}`] = null;
  const newOrder = [...(localState.order || []), pid];
  up[`order`] = newOrder;
  db.ref('rooms/' + roomCode).update(up);
}

function startGameTrigger() { db.ref('rooms/' + roomCode).update({ status: 'playing' }); }

// ── BOARD ──
function cellCoord(n) {
  // n: 1–100 → row (0=bottom), col (0=left)
  const idx = n - 1;
  const row = Math.floor(idx / 10); // 0 = bottom row (cells 1-10)
  const col = (row % 2 === 0) ? (idx % 10) : (9 - idx % 10);
  const gridRow = 9 - row; // SVG row 0 = top
  return {
    cx: col * 52 + 26,
    cy: gridRow * 52 + 26
  };
}

function buildBoard() {
  const board = document.getElementById('board');
  board.innerHTML = '';
  // Build grid: top-left is cell 100, bottom-left is cell 1
  // Row 0 of grid = row 9 of cells (91-100), alternating direction
  for (let gr = 0; gr < 10; gr++) {
    const cellRow = 9 - gr; // cellRow 0 = cells 1-10
    for (let gc = 0; gc < 10; gc++) {
      let cellNum;
      if (cellRow % 2 === 0) {
        cellNum = cellRow * 10 + gc + 1;
      } else {
        cellNum = cellRow * 10 + (9 - gc) + 1;
      }
      const cell = document.createElement('div');
      const isLight = (gr + gc) % 2 === 0;
      cell.className = 'cell ' + (isLight ? 'cell-light' : 'cell-dark');
      cell.id = 'cell-' + cellNum;
      cell.dataset.n = cellNum;
      if (snakes[cellNum]) cell.classList.add('snake-head');
      if (ladders[cellNum]) cell.classList.add('ladder-base');
      // Special cell 100
      if (cellNum === 100) {
        cell.innerHTML = `<span style="font-size:1.1rem; position:absolute; top:50%; left:50%; transform:translate(-50%,-55%);">⭐</span>`;
      } else {
        cell.innerHTML = `<span style="position:relative; z-index:1;">${cellNum}</span>`;
      }
      board.appendChild(cell);
    }
  }

  // Draw snakes & ladders in SVG overlay
  const svg = document.getElementById('overlay-svg');
  const CELL = 52, BOARD = 520;
  svg.setAttribute('viewBox', `0 0 ${BOARD} ${BOARD}`);
  svg.setAttribute('width', BOARD);
  svg.setAttribute('height', BOARD);
  svg.innerHTML = '';

  // Ladders
  Object.entries(ladders).forEach(([from, to]) => {
    const f = cellCoord(+from), t = cellCoord(+to);
    const dx = t.cx - f.cx, dy = t.cy - f.cy;
    const len = Math.sqrt(dx*dx + dy*dy);
    const ux = -dy/len * 6, uy = dx/len * 6;
    // Two rails + rungs
    const railColors = ['#f57f17','#f9a825'];
    [1,-1].forEach((side, si) => {
      const r1x = f.cx + ux*side, r1y = f.cy + uy*side;
      const r2x = t.cx + ux*side, r2y = t.cy + uy*side;
      const rail = document.createElementNS('http://www.w3.org/2000/svg','line');
      rail.setAttribute('x1', r1x); rail.setAttribute('y1', r1y);
      rail.setAttribute('x2', r2x); rail.setAttribute('y2', r2y);
      rail.setAttribute('stroke', railColors[si]);
      rail.setAttribute('stroke-width', '5');
      rail.setAttribute('stroke-linecap', 'round');
      svg.appendChild(rail);
    });
    // Rungs
    const steps = Math.round(len / 20);
    for (let i = 1; i < steps; i++) {
      const t2 = i / steps;
      const mx = f.cx + dx*t2, my = f.cy + dy*t2;
      const rung = document.createElementNS('http://www.w3.org/2000/svg','line');
      rung.setAttribute('x1', mx + ux*1.5); rung.setAttribute('y1', my + uy*1.5);
      rung.setAttribute('x2', mx - ux*1.5); rung.setAttribute('y2', my - uy*1.5);
      rung.setAttribute('stroke', '#fdd835');
      rung.setAttribute('stroke-width', '3.5');
      rung.setAttribute('stroke-linecap', 'round');
      svg.appendChild(rung);
    }
    // Arrow tip at top
    const tip = document.createElementNS('http://www.w3.org/2000/svg','circle');
    tip.setAttribute('cx', t.cx); tip.setAttribute('cy', t.cy);
    tip.setAttribute('r', '6');
    tip.setAttribute('fill', '#f57f17');
    svg.appendChild(tip);
  });

  // Snakes (cubic bezier curves)
  // Store control points globally for animation reuse
  window.snakePathData = {};
  const snakePathData = window.snakePathData;

  const snakeColorPairs = [
    ['#e53935','#b71c1c'], ['#43a047','#1b5e20'],
    ['#8e24aa','#4a148c'], ['#e91e63','#880e4f'],
    ['#ff6d00','#bf360c'], ['#00897b','#004d40'],
    ['#1565c0','#0d47a1'], ['#6d4c41','#3e2723'],
  ];
  Object.entries(snakes).forEach(([from, to], idx) => {
    const f = cellCoord(+from), t = cellCoord(+to);
    const [col1, col2] = snakeColorPairs[idx % snakeColorPairs.length];
    // Control points for an S-curve
    const mx = (f.cx + t.cx) / 2 + (Math.random()-0.5)*80;
    const my = (f.cy + t.cy) / 2 + (Math.random()-0.5)*80;
    // Store for animation
    snakePathData[+from] = { mx, my, toTile: +to };
    const path = document.createElementNS('http://www.w3.org/2000/svg','path');
    const d = `M ${f.cx} ${f.cy} Q ${mx} ${my} ${t.cx} ${t.cy}`;
    path.setAttribute('d', d);
    path.setAttribute('fill', 'none');
    path.setAttribute('stroke', col1);
    path.setAttribute('stroke-width', '9');
    path.setAttribute('stroke-linecap', 'round');
    path.setAttribute('opacity', '0.85');
    svg.appendChild(path);
    // Dashed stripe
    const path2 = document.createElementNS('http://www.w3.org/2000/svg','path');
    path2.setAttribute('d', d);
    path2.setAttribute('fill', 'none');
    path2.setAttribute('stroke', col2);
    path2.setAttribute('stroke-width', '4');
    path2.setAttribute('stroke-dasharray', '8 8');
    path2.setAttribute('stroke-linecap', 'round');
    path2.setAttribute('opacity', '0.7');
    svg.appendChild(path2);
    // Head circle at 'from'
    const head = document.createElementNS('http://www.w3.org/2000/svg','circle');
    head.setAttribute('cx', f.cx); head.setAttribute('cy', f.cy);
    head.setAttribute('r', '10'); head.setAttribute('fill', col1);
    svg.appendChild(head);
    // Eyes
    [-4,4].forEach(ex => {
      const eye = document.createElementNS('http://www.w3.org/2000/svg','circle');
      eye.setAttribute('cx', f.cx + ex); eye.setAttribute('cy', f.cy - 2);
      eye.setAttribute('r', '2'); eye.setAttribute('fill', 'white');
      svg.appendChild(eye);
    });
    // Tail dot
    const tail = document.createElementNS('http://www.w3.org/2000/svg','circle');
    tail.setAttribute('cx', t.cx); tail.setAttribute('cy', t.cy);
    tail.setAttribute('r', '5'); tail.setAttribute('fill', col2); tail.setAttribute('opacity','0.7');
    svg.appendChild(tail);
  });

  boardBuilt = true;
}

// ── TOKENS ──
// Track current displayed positions separately from Firebase state
const tokenDisplayPos = {}; // id -> current displayed tile number
const tokenAnimating = {}; // id -> bool

function getOrCreateToken(svg, id, color) {
  let el = document.getElementById('tok-' + id);
  if (!el) {
    const g = document.createElementNS('http://www.w3.org/2000/svg','g');
    g.id = 'tok-' + id;
    g.style.transition = 'none';
    // Shadow
    const shadow = document.createElementNS('http://www.w3.org/2000/svg','circle');
    shadow.id = 'tok-shadow-' + id;
    shadow.setAttribute('r', '14'); shadow.setAttribute('fill', 'rgba(0,0,0,0.3)');
    shadow.setAttribute('cx', '2'); shadow.setAttribute('cy', '4');
    g.appendChild(shadow);
    // Body
    const circ = document.createElementNS('http://www.w3.org/2000/svg','circle');
    circ.id = 'tok-body-' + id;
    circ.setAttribute('r', '13'); circ.setAttribute('fill', color);
    circ.setAttribute('stroke', 'white'); circ.setAttribute('stroke-width', '3');
    g.appendChild(circ);
    // Gloss
    const gloss = document.createElementNS('http://www.w3.org/2000/svg','ellipse');
    gloss.setAttribute('rx','6'); gloss.setAttribute('ry','4');
    gloss.setAttribute('cx','-2'); gloss.setAttribute('cy','-5');
    gloss.setAttribute('fill','rgba(255,255,255,0.45)');
    g.appendChild(gloss);
    svg.appendChild(g);
    el = g;
  }
  return el;
}

// Instantly place token at tile n (no animation)
function snapToken(id, n, playerIndex) {
  const svg = document.getElementById('overlay-svg');
  const tok = getOrCreateToken(svg, id, '');
  const { cx, cy } = cellCoord(n);
  const ox = (playerIndex % 2) * 16 - 8;
  const oy = Math.floor(playerIndex / 2) * 16 - 8;
  tok.setAttribute('transform', `translate(${cx + ox},${cy + oy})`);
  tokenDisplayPos[id] = n;
}

// Animate token moving step-by-step from fromTile to toTile
async function animateSteps(id, fromTile, toTile, playerIndex) {
  const svg = document.getElementById('overlay-svg');
  const tok = getOrCreateToken(svg, id, '');
  const STEP_MS = 160; // ms per tile hop
  const BOUNCE_HEIGHT = 22;

  let cur = fromTile;
  const dir = toTile > fromTile ? 1 : -1;

  while (cur !== toTile) {
    cur += dir;
    const { cx, cy } = cellCoord(cur);
    const ox = (playerIndex % 2) * 16 - 8;
    const oy = Math.floor(playerIndex / 2) * 16 - 8;
    const tx = cx + ox, ty = cy + oy;

    // Hop arc: go up, then land
    await animateTokenArc(tok, tx, ty - BOUNCE_HEIGHT, 70);
    await animateTokenArc(tok, tx, ty, 80);

    // Squash on land
    await squashToken(tok, tx, ty);

    // Flash cell highlight
    flashCell(cur);
    tokenDisplayPos[id] = cur;
  }
}

// Animate token following a snake path (quadratic bezier)
async function animateSnakePath(id, fromTile, toTile, playerIndex, pathD) {
  const svg = document.getElementById('overlay-svg');
  const tok = getOrCreateToken(svg, id, '');
  const DURATION = 900;
  const STEPS = 30;

  // Get stored bezier control points for this snake
  const pathInfo = window.snakePathData && window.snakePathData[fromTile];
  if (!pathInfo) { snapToken(id, toTile, playerIndex); return; }

  // Parse the Q path to get control points for interpolation
  const { cx: fx, cy: fy } = cellCoord(fromTile);
  const { cx: tx2, cy: ty2 } = cellCoord(toTile);

  const { mx, my } = pathInfo;
  const ox = (playerIndex % 2) * 16 - 8;
  const oy = Math.floor(playerIndex / 2) * 16 - 8;

  for (let i = 0; i <= STEPS; i++) {
    const t = i / STEPS;
    // Quadratic bezier interpolation
    const bx = (1-t)*(1-t)*fx + 2*(1-t)*t*mx + t*t*tx2;
    const by = (1-t)*(1-t)*fy + 2*(1-t)*t*my + t*t*ty2;
    tok.setAttribute('transform', `translate(${bx + ox},${by + oy})`);
    await wait(DURATION / STEPS);
  }
  tokenDisplayPos[id] = toTile;
}

// Animate token climbing a ladder (linear interpolation)
async function animateLadderClimb(id, fromTile, toTile, playerIndex) {
  const svg = document.getElementById('overlay-svg');
  const tok = getOrCreateToken(svg, id, '');
  const DURATION = 700;
  const STEPS = 25;
  const { cx: fx, cy: fy } = cellCoord(fromTile);
  const { cx: tx, cy: ty } = cellCoord(toTile);
  const ox = (playerIndex % 2) * 16 - 8;
  const oy = Math.floor(playerIndex / 2) * 16 - 8;

  // Slight wobble as climbing
  for (let i = 0; i <= STEPS; i++) {
    const t = i / STEPS;
    const ease = t < 0.5 ? 2*t*t : -1+(4-2*t)*t; // easeInOut
    const bx = fx + (tx - fx) * ease;
    const by = fy + (ty - fy) * ease;
    const wobble = Math.sin(t * Math.PI * 6) * 3;
    tok.setAttribute('transform', `translate(${bx + ox + wobble},${by + oy})`);
    await wait(DURATION / STEPS);
  }
  tokenDisplayPos[id] = toTile;
}

function animateTokenArc(tok, tx, ty, ms) {
  return new Promise(resolve => {
    tok.setAttribute('transform', `translate(${tx},${ty})`);
    setTimeout(resolve, ms);
  });
}

async function squashToken(tok, tx, ty) {
  const body = tok.querySelector('circle:nth-child(2)') || tok.querySelectorAll('circle')[1];
  // Squash
  if (body) {
    body.setAttribute('transform', 'scale(1.35,0.7)');
    await wait(60);
    body.setAttribute('transform', 'scale(0.9,1.15)');
    await wait(60);
    body.setAttribute('transform', 'scale(1,1)');
  }
}

function flashCell(n) {
  const cell = document.getElementById('cell-' + n);
  if (!cell) return;
  cell.style.filter = 'brightness(1.6)';
  setTimeout(() => { cell.style.filter = ''; }, 180);
}

// ── GAME ──
function showGame(data) {
  document.getElementById('lobby-screen').classList.remove('active');
  document.getElementById('game-layout').style.display = 'flex';
  if (!boardBuilt) buildBoard();
  updateVisuals(data);
}

// Previous positions for change-detection
const prevPositions = {};

function updateVisuals(data) {
  if (!data.order) return;
  const activeId = data.order[data.turnIndex % data.order.length];
  const isMyTurn = (activeId === myId);

  // Scores
  const scoreDiv = document.getElementById('score-list');
  scoreDiv.innerHTML = '';
  data.order.forEach(id => {
    const p = data.players[id];
    const row = document.createElement('div');
    row.className = 'score-row' + (id === activeId ? ' my-turn' : '');
    row.innerHTML = `<div class="color-dot" style="background:${p.color}"></div>
      <span style="font-size:0.9rem;">${p.name}</span>
      <span class="tile-num">🏠 ${p.pos}</span>`;
    scoreDiv.appendChild(row);
  });

  // Turn text
  const turnEl = document.getElementById('turn-text');
  if (isMyTurn) {
    turnEl.innerHTML = '<span style="color:var(--green-dark)">🎯 Your turn!</span>';
    turnEl.className = 'turn-text my-turn';
  } else {
    const ap = data.players[activeId];
    turnEl.innerHTML = `⏳ Waiting for<br><strong>${ap.name}</strong>`;
    turnEl.className = 'turn-text';
  }

  const rollBtn = document.getElementById('roll-btn');
  rollBtn.disabled = !isMyTurn || rolling;

  // Dice
  rotateDice(data.lastRoll || 1);
  document.getElementById('dice-num').innerText = data.lastRoll ? `Rolled: ${data.lastRoll}` : '–';

  // Tokens — detect position changes and animate for ALL players
  const svg = document.getElementById('overlay-svg');
  data.order.forEach((id, i) => {
    const p = data.players[id];
    const tok = getOrCreateToken(svg, id, p.color);
    tok.querySelectorAll('circle')[1]?.setAttribute('fill', p.color);

    const prev = prevPositions[id];
    const cur  = p.pos;
    // rawPos is the tile BEFORE snake/ladder teleport (stored in Firebase by rolling player)
    // Fall back to cur if not yet present (e.g. game just started)
    const rawLand = (p.rawPos !== undefined && p.rawPos !== null) ? p.rawPos : cur;

    if (prev === undefined) {
      // First time seeing this player — snap into place, no animation
      snapToken(id, cur, i);
      prevPositions[id] = cur;
    } else if (prev !== cur && !tokenAnimating[id]) {
      // Position changed — animate the full sequence
      tokenAnimating[id] = true;
      prevPositions[id] = cur;

      const wasSnake  = rawLand !== cur && snakes[rawLand]  === cur;
      const wasLadder = rawLand !== cur && ladders[rawLand] === cur;

      const playerName = p.name;

      (async () => {
        // Step 1: hop cell-by-cell to the raw landing tile
        await animateSteps(id, prev, rawLand, i);

        // Step 2a: snake — slide along the bezier curve
        if (wasSnake) {
          await wait(280);
          showToast(`🐍 ${playerName} hit a snake!`, 'snake');
          tok.querySelectorAll('circle')[1]?.setAttribute('fill', '#ef5350');
          await animateSnakePath(id, rawLand, cur, i);
          await wait(100);
          tok.querySelectorAll('circle')[1]?.setAttribute('fill', p.color);
        }
        // Step 2b: ladder — wobble climb up
        else if (wasLadder) {
          await wait(280);
          showToast(`🪜 ${playerName} climbed a ladder!`, 'ladder');
          tok.querySelectorAll('circle')[1]?.setAttribute('fill', '#66bb6a');
          await animateLadderClimb(id, rawLand, cur, i);
          await wait(100);
          tok.querySelectorAll('circle')[1]?.setAttribute('fill', p.color);
        }

        // Step 3: victory bounce on tile 100
        if (cur === 100) {
          for (let b = 0; b < 3; b++) {
            const { cx, cy } = cellCoord(100);
            const ox2 = (i%2)*16-8, oy2 = Math.floor(i/2)*16-8;
            await animateTokenArc(tok, cx+ox2, cy-30+oy2, 120);
            await animateTokenArc(tok, cx+ox2, cy+oy2, 120);
          }
        }

        tokenAnimating[id] = false;
      })();
    }
  });
}

function rotateDice(val) {
  const rots = {
    1: 'rotateX(0deg) rotateY(0deg)',
    2: 'rotateY(-90deg)',
    3: 'rotateY(-180deg)',
    4: 'rotateY(90deg)',
    5: 'rotateX(-90deg)',
    6: 'rotateX(90deg)'
  };
  document.getElementById('dice').style.transform = rots[val] || rots[1];
}

async function handleRoll() {
  if (rolling) return;
  rolling = true;
  document.getElementById('roll-btn').disabled = true;

  const roll = Math.floor(Math.random() * 6) + 1;
  const dice = document.getElementById('dice');

  // Multi-spin shake
  dice.style.transition = '0.15s ease';
  for (let s = 0; s < 4; s++) {
    dice.style.transform = `rotateX(${Math.random()*720}deg) rotateY(${Math.random()*720}deg) rotateZ(${(Math.random()-0.5)*40}deg)`;
    await wait(150);
  }
  dice.style.transition = '0.7s cubic-bezier(0.17,0.67,0.83,0.67)';

  let rawPos = localState.players[myId].pos + roll;
  if (rawPos > 100) rawPos = localState.players[myId].pos;

  let nPos = rawPos;
  if (snakes[nPos])  nPos = snakes[nPos];
  if (ladders[nPos]) nPos = ladders[nPos];

  const nextTurn = (localState.turnIndex + 1) % localState.order.length;
  const up = {};
  up[`players/${myId}/pos`]     = nPos;
  up[`players/${myId}/rawPos`]  = rawPos;  // ← store intermediate tile for all clients
  up[`turnIndex`] = nextTurn;
  up[`lastRoll`]  = roll;
  if (nPos === 100) up[`winner`] = myId;

  await db.ref('rooms/' + roomCode).update(up);

  if (nPos === 100) {
    setTimeout(() => showWin(localState.players[myId].name), 2800);
  }

  // Re-enable roll only after animations complete
  const animWait = roll * 170 + (snakes[rawPos] || ladders[rawPos] ? 1200 : 400);
  setTimeout(() => { rolling = false; }, animWait);
}

// Also listen for someone else winning
db.ref && setInterval(() => {
  if (localState && localState.winner && localState.winner !== myId) {
    const wname = localState.players[localState.winner]?.name;
    if (wname) showWin(wname, true);
  }
}, 1000);

function showWin(name, isOther) {
  const ov = document.getElementById('win-overlay');
  if (ov.classList.contains('show')) return;
  document.getElementById('win-name').innerText = isOther ? `${name} Wins!` : '🎉 You Win!';
  document.getElementById('win-sub').innerText = isOther ? `Better luck next time!` : `Congratulations, ${name}!`;
  ov.classList.add('show');
}

function showToast(msg, type) {
  const t = document.getElementById('toast');
  t.innerText = msg;
  t.className = 'show ' + (type || '');
  setTimeout(() => { t.className = type || ''; }, 2500);
}

function wait(ms) { return new Promise(r => setTimeout(r, ms)); }
